# --- Service ---
spring.application.name=MS3
server.port=8083

# --- Base de donnees (une base par microservice) ---
spring.datasource.url=jdbc:mysql://localhost:3306/ms3_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Eureka : enregistrement du service (TP Eureka, partie 2) ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- Actuator (TP Observabilite, partie 1) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true
info.app.name=MS3
info.app.version=1.0.0
info.app.description=Microservice Health Profile & Medical Tracking
info.app.team=Nexora - WellNest

# --- Securite (Keycloak) : decommenter quand le realm est pret ---

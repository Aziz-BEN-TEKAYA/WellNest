# Profil de test : base H2 en memoire, pas besoin de PostgreSQL
spring.datasource.url=jdbc:h2:mem:ms4_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
eureka.client.enabled=false
ms4.security.enabled=false

# --- Service ---
spring.application.name=MS4
# Port surchargeable pour lancer plusieurs instances : --server.port=8094 ou SERVER_PORT=8094
server.port=8084

# --- Base de donnees PostgreSQL (une base par microservice) ---
# Creer la base une fois : CREATE DATABASE ms4_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/ms4_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Eureka : enregistrement du service (TP Eureka, partie 2) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Identifiant d'instance stable (IP:nom:port) : plusieurs instances sur la meme machine restent distinctes
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
# Publie dans Eureka le statut calcule par /actuator/health (base en panne => instance DOWN)
eureka.client.healthcheck.enabled=true

# --- Actuator (TP Observabilite) : http://localhost:8084/actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=WellNest MS4 - Sleep & Mental Wellness
info.app.description=Suivi du sommeil, de l'humeur, du stress et des activites de detente (saisie manuelle)
info.app.version=@project.version@
info.app.base-url=/api/v1/sleep-wellness
info.app.team=Nexora - WellNest
info.app.owner=Mohamed Aziz Garwachi

# --- Securite (Keycloak) ---
# false = developpement : endpoints ouverts, utilisateur identifie par l'en-tete X-User-Id
ms4.security.enabled=false
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/<realm>

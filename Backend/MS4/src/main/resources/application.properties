spring.application.name=MS4
server.port=8084

# --- Base de donnees PostgreSQL (une base par microservice) ---
# Creer la base une fois : CREATE DATABASE ms4_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/ms4_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Eureka : desactive tant que le serveur Eureka n'est pas dans le depot ---
eureka.client.enabled=${EUREKA_ENABLED:false}

# --- Securite (Keycloak) ---
# false = developpement : endpoints ouverts, utilisateur identifie par l'en-tete X-User-Id
ms4.security.enabled=false
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/<realm>

spring.application.name=MS2
server.port=8082

# --- Base de donnees MySQL (une base par microservice) ---
spring.datasource.url=jdbc:mysql://localhost:3306/ms2_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# Identifiants lus dans les variables d'environnement DB_USERNAME / DB_PASSWORD
# (valeurs par defaut : root, sans mot de passe). Ne jamais commiter un vrai mot de passe.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Actuator : http://localhost:8082/actuator ---
# health : etat du service | info : description | metrics : mesures (JVM, requetes HTTP...)
# loggers : lire et changer le niveau des logs sans redemarrer (a proteger avec Keycloak)
management.endpoints.web.exposure.include=health,info,metrics,loggers
# Detail de la sante (base, disque, Eureka). A passer en "when-authorized" avec Keycloak.
management.endpoint.health.show-details=always
# Contenu de /actuator/info
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=WellNest - Physical Activity & Mobility
info.app.description=Suivi de l'activite physique et de la mobilite des seniors
info.app.version=@project.version@
info.app.base-url=/api/v1/activity
info.app.team=WellNest
info.app.owner=Aziz Ben Tekaya

# --- Eureka : publier la sante reelle (DOWN si la base tombe) au lieu de toujours UP ---
eureka.client.healthcheck.enabled=true

# --- Securite (Keycloak) : decommenter quand le realm est pret ---

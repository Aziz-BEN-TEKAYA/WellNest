spring.application.name=MS2
server.port=8082

# --- Base de donnees MySQL (une base par microservice) ---
spring.datasource.url=jdbc:mysql://localhost:3306/ms2_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Actuator : http://localhost:8082/actuator/health et /actuator/info ---
management.endpoints.web.exposure.include=health,info
# Detail de la sante (base, disque, Eureka). A passer en "when-authorized" avec Keycloak.
management.endpoint.health.show-details=always
# Contenu de /actuator/info
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=WellNest - Physical Activity & Mobility
info.app.description=Suivi de l'activite physique et de la mobilite des seniors
info.app.version=@project.version@
info.app.base-url=/api/v1/activity

# --- Eureka : publier la sante reelle (DOWN si la base tombe) au lieu de toujours UP ---
eureka.client.healthcheck.enabled=true

# --- Securite (Keycloak) : decommenter quand le realm est pret ---
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/<realm>

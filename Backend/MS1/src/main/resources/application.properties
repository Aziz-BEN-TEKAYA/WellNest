spring.application.name=MS1
server.port=8081
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# --- Base de donnees (une base par microservice) ---
spring.datasource.url=jdbc:mysql://localhost:3306/wellnest_ms1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Swagger UI : http://localhost:8081/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Securite (Keycloak) : decommenter quand le realm est pret ---
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/<realm>

spring.application.name=eureka-server
server.port=8761

# --- Serveur Eureka autonome (un seul noeud en developpement) ---
eureka.instance.hostname=localhost
# Le serveur ne s'enregistre pas aupres de lui-meme et ne recupere pas d'annuaire
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# En developpement : retirer rapidement les services arretes au lieu de les garder "par precaution"
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000

# --- Actuator : http://localhost:8761/actuator/health et /actuator/info ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=WellNest - Eureka Server
info.app.description=Annuaire des microservices WellNest
info.app.version=@project.version@
